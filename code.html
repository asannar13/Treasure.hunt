<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enter the Secret Code</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="code-page">
  <main id="code-container">
    <h1>Enter the Secret Code</h1>

    <p>Use the clues from the newsletter to unlock the treasure.</p>

    <form id="code-form">
      <label for="code-input">Secret code</label>

      <input
        id="code-input"
        name="code"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Enter code"
        required
      >

      <button id="submit-code" type="submit">Submit</button>
    </form>

    <p id="code-message" role="status" aria-live="polite"></p>

    <button id="reset-btn" type="button">
      Return to the forest
    </button>
  </main>
</body>
</html>
